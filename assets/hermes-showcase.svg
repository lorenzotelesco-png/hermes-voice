 fill="#b7bac0">◖ General</text><text x="28" y="818" font-size="14" fill="#b7bac0">◖ Hermes Voice</text><text x="226" y="574" font-size="16" font-weight="600" fill="#eee"># hermes-transcriptions</text><line x1="218" y1="592" x2="770" y2="592" stroke="#272a30"/><text x="242" y="632" font-size="14" font-weight="600" fill="#eee">Hermes Voice</text><text x="336" y="632" font-size="10" fill="#777b83">10:30</text><rect x="242" y="650" width="490" height="92" rx="10" fill="#15181d" stroke="#2a2d33"/><text x="260" y="674" font-size="12" font-weight="600" fill="#dfe1e5">Transcription</text><text x="260" y="698" font-size="12" fill="#aeb2b8">User: What's the weather like today?</text><text x="260" y="720" font-size="12" fill="#dfe1e5">Hermes: It's currently 22°C and partly cloudy in your area.</text><text x="242" y="786" font-size="14" font-weight="600" fill="#eee">Hermes Voice</text><text x="336" y="786" font-size="10" fill="#777b83">10:35</text><rect x="242" y="804" width="490" height="92" rx="10" fill="#15181d" stroke="#2a2d33"/><text x="260" y="828" font-size="12" font-weight="600" fill="#dfe1e5">Transcription</text><text x="260" y="852" font-size="12" fill="#aeb2b8">User: Remind me to drink water every hour.</text><text x="260" y="874" font-size="12" fill="#dfe1e5">Hermes: Okay, I’ll remind you every hour.</text></g><!-- privacy --><g class="s"><circle cx="844" cy="584" r="22" fill="#2e8b57"/><path d="M836 584l6 6 11-14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="884" y="592" font-size="26" font-weight="600" fill="#f3f3f4">Privacy First</text><text x="828" y="654" font-size="16" fill="#9a9da4">Hermes is designed with privacy as a priority.</text><circle cx="832" cy="720" r="4" fill="#2e8b57"/><text x="850" y="726" font-size="15" fill="#ddd">Local processing when possible</text><circle cx="832" cy="770" r="4" fill="#2e8b57"/><text x="850" y="776" font-size="15" fill="#ddd">No unnecessary data collection</text><circle cx="832" cy="820" r=